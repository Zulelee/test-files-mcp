[project]
name = "test-files-mcp"
version = "0.1.0"
description = "Generate test files directly from Cursor, Claude, and other MCP clients."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Zulelee", email = "hey.zulele@gmail.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "testing",
    "fixtures",
    "qa",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp[cli]>=2.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "reportlab>=4.0.0",
]

[project.scripts]
test-files-mcp = "test_files_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Zulelee/test-files-mcp"
Repository = "https://github.com/Zulelee/test-files-mcp"
Issues = "https://github.com/Zulelee/test-files-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_files_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/test_files_mcp", "tests", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
